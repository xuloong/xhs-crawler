name: Build Windows Client

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt

      - name: Install Playwright runtime
        run: python -m playwright install chromium

      - name: Generate icon assets
        run: python scripts/generate_app_icon.py

      - name: Build Windows executable
        run: python scripts/build_desktop.py

      - name: Package artifact
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/小红书笔记批量爬取工具" -DestinationPath "dist/小红书笔记批量爬取工具-windows.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xhs-crawler-windows
          path: dist/小红书笔记批量爬取工具-windows.zip
